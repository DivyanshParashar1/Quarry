<title>New User Registration</title><h1>New User Registration</h1>
<input id="dialogTemplate-dialogForm-userName" type="text" aria-label="User Name">
<input id="dialogTemplate-dialogForm-password" type="password" aria-label="Password">
<input id="dialogTemplate-dialogForm-passwordConfirm" type="password" aria-label="Re-enter Password">
<input id="dialogTemplate-dialogForm-email" type="text" aria-label="Email Address">
<input id="dialogTemplate-dialogForm-emailConfirm" type="text" aria-label="Re-enter Email Address">
<input id="dialogTemplate-dialogForm-privacyAgreementAccepted" type="checkbox" aria-label="I have read and accept the privacy agreement">
<input type="button" id="dialogTemplate-dialogForm-defaultCmd" value="Register">
<input type="button" id="dialogTemplate-dialogForm-loginLink" value="Login">
