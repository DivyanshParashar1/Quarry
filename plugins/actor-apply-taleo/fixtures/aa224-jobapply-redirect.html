<HTML>
<META HTTP-EQUIV="Pragma" CONTENT="no-cache"/>
<META HTTP-EQUIV="Expires" CONTENT="-1"/>
<HEAD>
<TITLE>htmlredirection</TITLE>
<script type="text/javascript">
function redirectRequest()
{
    var uri = "\/careersection\/iam\/accessmanagement\/login.jsf?lang=en&redirectionURI=https%3A%2F%2Faa224.taleo.net%2Fcareersection%2Fex%2Fjobapply.ftl%3Fjob%3DJR111341%26lang%3Den&TARGET=https%3A%2F%2Faa224.taleo.net%2Fcareersection%2Fex%2Fjobapply.ftl%3Fjob%3DJR111341%26lang%3Den";
if (getAnchors() != null)
    {
        var redirectionURI = extractParam(uri, "redirectionURI");
        var targetURI = extractParam(uri, "TARGET");
        uri = uri.replace(redirectionURI, redirectionURI + encodeURIComponent(getAnchors()));
        uri = uri.replace(targetURI, targetURI + encodeURIComponent(getAnchors()));
        uri += getAnchors();
    }
    document.location = uri;
}
function extractParam(uri, param)
{
    if (uri.indexOf(param) < 0)
    {
        return null;
    }
    var start = uri.indexOf(param);
    var end = uri.indexOf("&", uri.indexOf(param) + 1);
    if (end >= 0)
    {
        return uri.substring(start, end);
    }
    else {
        return uri.substring(start);
    }
}
function getAnchors()
{
    if (location.href.indexOf("#") < 0)
    {
        return null;
     }
    else
    {
       return location.href.substring(location.href.indexOf("#"));
    }
}
</script>
</HEAD>
<body>
</body>
<script type="text/javascript">
redirectRequest();
</script>
</html>
