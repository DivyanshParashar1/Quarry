# What you are looking for. Load with `pnpm quarry profile load` (re-run after edits).
# Hard filters (seniority, locations/remote_policy, graduation_year,
# experience_years, exclusions) drop jobs before any LLM call; the rest feeds
# the similarity prefilter and the LLM rubric. Empty lists mean "no filter".

# Target roles, e.g. [Backend Engineer, Platform Engineer]
roles:
  - SDE Intern
  - Software Engineer Intern
  - Backend Engineer Intern
  - Full Stack Engineer Intern
  - AI Engineer Intern
  - AI Developer Intern

# Acceptable levels: intern | junior | mid | senior | staff | principal | lead | manager | director | executive
# Titles without a level marker ("Software Engineer") count as mid.
seniority: [intern]

# Acceptable locations; case-insensitive substring match, e.g. [Bengaluru, Bangalore, India]
locations:
  - India
  - Bengaluru
  - Bangalore
  - Hyderabad
  - Pune
  - Mumbai
  - Chennai
  - Gurugram
  - Gurgaon
  - Noida
  - Delhi
  - Kolkata
  - Ahmedabad

# Acceptable arrangements: remote | hybrid | onsite. With `remote` listed, a
# remote job passes the location filter when its location names no place
# ("Remote", "Worldwide") or one of yours; "Remote, US" stays US-only.
remote_policy: [remote, hybrid, onsite]

# Technologies you want to work with (also used for similarity).
stack: [TypeScript, Node.js, Fastify, Express.js, PostgreSQL, Redis, Docker, React, LLMs, Multi-Agent Systems]

# e.g. { amount: 2500000, currency: INR, period: year }. Used by the LLM rubric only.
salary_floor: { amount: 2500000, currency: INR, period: year }

# Years of professional experience. Jobs asking for much more are dropped.
experience_years: 0

# Graduation year ("batch"). Jobs restricted to other batches are dropped.
graduation_year: 2027

# Keyword gates (hard filters). A job's title must contain at least one of
# title_any, and its description at least one of description_any (whole-word,
# case-insensitive). Empty = no requirement. With the matcher in keyword mode
# these decide relevance on their own; `stack` hits only rank the survivors.
keywords:
  title_any:
    - software
    - sde
    - swe
    - developer
    - backend
    - back-end
    - full stack
    - full-stack
    - fullstack
    - ai
    - ml
    - machine learning
    - genai
    - llm
    - web
    - platform
  description_any: []

exclusions:
  companies: []
  title_keywords: []        # e.g. [sales, recruiter]
  description_keywords: []  # e.g. [security clearance]

# Anything else the matcher should weigh, in plain words.
notes: >-
  Final-year student looking for a backend-leaning SDE internship. Strongest in
  TypeScript backends; open to relocating.

# Phase 11: what ATS application forms are filled with (Greenhouse / Lever / Ashby).
# Nothing here is ever invented: a form question with no matching value is left
# for you in the review queue. Editing this section does not trigger a re-match.
application:
  first_name: Jane
  last_name: Doe
  email: jane.doe@example.com
  phone: "+1 555 123 4567"
  location: Bengaluru, India
  linkedin_url: https://www.linkedin.com/in/janedoe/
  github_url: https://github.com/janedoe
  website_url: null
  current_company: null
  current_title: null
  university: Northfield Institute of Technology
  degree: B.Tech, Computer Science
  work_authorization: { India: yes, US: no }
  requires_sponsorship: null      # true / false; null = ask me
  notice_period_days: null
  answers:                        # recurring custom questions (substring match on the label)
    - { match: "hear about", answer: "Company careers page" }
  eeo:                            # optional; null = leave for me, "decline" = pick the decline option
    gender: null
    race: null
    hispanic_latino: null
    veteran_status: null
    disability_status: null
    pronouns: null
